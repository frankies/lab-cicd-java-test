version: "3"
services: 

  workspace:
    build:
      context: workspace
    tty: true
    environment:
      TZ: ${TZ}
      LANG: ${LANG}
    networks:
      - backend

  ### PostgreSQL ###########################################
  postgres:
    image: postgresql:17-alpine
    build:
      context: postgres
      # target: postgresql13-${ENVIRONMENT_NAME}
    volumes:
     - ./postgres/data:/var/lib/postgresql/data
    #  - ./sources.list:/etc/apt/sources.list
    ports:
      - "35432:5432"    
    command: >-
      -c 'shared_buffers=128MB'
      -c 'effective_cache_size=256MB'
      -c 'work_mem=4MB'
    environment:
      TZ: ${TZ}
      LANG: ${LANG}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8 --data-checksums --auth-local=md5 --auth-host=md5
      DB_DATABASE: ${DB_DATABASE:-appdb}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    networks:
      - backend

  pgadmin:
    image: pgadmin9
    build:
      context: pgadmin
      args:
        - POSTGRES_USER=${POSTGRES_USER:-postgres}
        - DB_USERNAME=${DB_USERNAME:-app}
    ports:
      - "5750:80"
    volumes:
      - ./pgadmin/data:/var/lib/pgadmin
      # - ./postgresql.conf.custom:/var/lib/postgresql/data/postgresql.conf.custom   
    environment:
      TZ: ${TZ}
      LANG: ${LANG}
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-secret}
    depends_on:  
      - postgres
    networks:
      - backend

networks: 
  backend:
    driver: ${NETWORKS_DRIVER}